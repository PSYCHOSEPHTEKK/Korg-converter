<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Korg Electribe 2 WAV-Konverter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Korg Electribe 2 WAV-Konverter</h1>
    <p>Zerlege MP3-Dateien direkt im Browser in kompatible kleine WAV-Samples.</p>

    <label class="drop" id="dropzone">
      <span>MP3 hier ablegen oder auswählen</span>
      <input id="file" type="file" accept="audio/mpeg,audio/mp3,.mp3" />
    </label>

    <section class="controls">
      <label>Abtastrate
        <select id="rate">
          <option value="44100" selected>44.1 kHz</option>
          <option value="48000">48 kHz</option>
        </select>
      </label>
      <label>Kanäle
        <select id="channels">
          <option value="1" selected>Mono</option>
          <option value="2">Stereo</option>
        </select>
      </label>
      <label>Max. Länge (Sekunden)
        <input id="seconds" type="number" min="1" max="600" value="30" />
      </label>
      <label><input id="normalize" type="checkbox" checked /> Lautheit begrenzen</label>
    </section>

    <button id="convert" disabled>MP3 in WAV konvertieren</button>
    <div id="status" aria-live="polite"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
