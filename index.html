<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Korg Electribe 2 WAV-Konverter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Korg Electribe 2 WAV-Konverter</h1>
    <p>Wähle eine Audio- oder Videodatei und exportiere einen manuell gewählten Ausschnitt als kleine WAV-Datei. Die Datei bleibt auf deinem Gerät.</p>

    <label class="drop" id="dropzone">
      <span>Audio oder Video hier ablegen oder auswählen</span>
      <input id="file" type="file" accept="audio/*,video/*,.mp3,.mp4,.mov,.webm,.m4v,.mkv" />
    </label>

    <section class="controls">
      <label>Startzeit (Sekunden)
        <input id="start" type="number" min="0" step="0.1" value="0" />
      </label>
      <label>Länge des Ausschnitts (max. 10 Sekunden)
        <input id="seconds" type="number" min="0.1" max="10" step="0.1" value="10" />
      </label>
      <label>Abtastrate
        <select id="rate">
          <option value="44100" selected>44.1 kHz</option>
          <option value="48000">48 kHz</option>
        </select>
      </label>
      <label>Kanäle
        <select id="channels">
          <option value="1" selected>Mono (kleinere Datei)</option>
          <option value="2">Stereo</option>
        </select>
      </label>
      <label class="check"><input id="normalize" type="checkbox" checked /> Spitzenpegel begrenzen</label>
    </section>

    <button id="convert" disabled>Ausschnitt als WAV speichern</button>
    <div id="status" aria-live="polite"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
